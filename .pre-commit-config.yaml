# Pre-commit hooks for lab-manager.
#
# Install with:
#   pip install pre-commit
#   pre-commit install
#
# Run against all files (CI parity) with:
#   pre-commit run --all-files
#
# Hooks are pinned by tag (not branch) so a commit on a hook repo cannot
# silently change behaviour between CI runs. Bump deliberately.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.11
        files: '^(app|scripts|tests)/.*\.py$'

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python imports)
        args: ["--profile", "black", "--filter-files"]
        files: '^(app|scripts|tests)/.*\.py$'

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]
        additional_dependencies: [flake8-bugbear, flake8-comprehensions]
        files: '^(app|scripts|tests)/.*\.py$'

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: '^app/.*\.py$'
        additional_dependencies: [pydantic, sqlalchemy, types-requests]
        args: [--ignore-missing-imports, --no-strict-optional, --check-untyped-defs]

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "--recursive"]
        additional_dependencies: ["bandit[toml]"]
        files: '^(app|scripts)/.*\.py$'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.1-beta
    hooks:
      - id: hadolint-docker
        args: [--failure-threshold, warning]

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  submodules: false
